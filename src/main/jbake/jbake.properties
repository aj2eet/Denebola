# JBake configuration for the Denebola marketing site.
# We hand-author every page as its own content file, so JBake's
# auto-generated blog-style outputs are switched off.
render.index=false
render.archive=false
render.feed=false
render.tags=false
render.sitemap=false
render.robots=false

render.encoding=UTF-8
default.status=published

# Each template.<type>.file entry registers a custom document type "<type>"
# and points it at its template (JBake discovers types this way, by scanning
# for template.*.file config keys).
template.home.file=home.ftl
template.solutions.file=solutions.ftl
template.about.file=about.ftl
template.contact.file=contact.ftl
template.notfound.file=notfound.ftl
